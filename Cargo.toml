[package]
name = "tedpinkerton-ca"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
dioxus-typst = "0.3.1"
include_dir = { version = "0.7", features = ["glob"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
