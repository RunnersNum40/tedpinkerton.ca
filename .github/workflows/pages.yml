name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install dioxus-cli
        run: cargo binstall -y dioxus-cli --version 0.7.10 --locked
      - name: Render static site
        run: dx build --web --ssg --release --locked --force-sequential true --debug-symbols false
      - name: Configure GitHub Pages error page
        run: cp target/dx/tedpinkerton-ca/release/web/public/404/index.html target/dx/tedpinkerton-ca/release/web/public/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/tedpinkerton-ca/release/web/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
